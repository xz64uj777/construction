name: Build and Deploy Godot WreckWorks Web Prototype

on:
  push:
    branches: [godot-wrecking-ball]
    paths:
      - "godot/**"
      - ".github/workflows/godot-web-build.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  export-web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Godot and export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: false
          include-templates: true
      - name: Validate project
        run: godot --headless --path godot --editor --quit
      - name: Export Web build
        run: |
          cd godot
          mkdir -p build
          godot --headless --path . --export-release "Web" build/index.html
      - name: Upload downloadable build
        uses: actions/upload-artifact@v4
        with:
          name: wreckworks-godot-web
          path: godot/build/
          if-no-files-found: error
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: godot/build/
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
