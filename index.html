<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>WreckWorks 3D — Demolition Simulator</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#8da5b0;font-family:system-ui,Arial;color:#f5f7f8;touch-action:none}canvas{display:block}#hud{position:fixed;inset:0;z-index:10;pointer-events:none} .panel{background:rgba(12,20,26,.82);border:1px solid #53646c;border-radius:12px;padding:10px 12px;backdrop-filter:blur(6px)}#brand{position:absolute;top:10px;left:10px;font-weight:900;letter-spacing:.09em;font-size:13px}#brand small{display:block;color:#f0b34d;font-size:10px;letter-spacing:.16em;margin-top:3px}#job{position:absolute;top:10px;right:10px;max-width:45%;font-size:12px;text-align:right}#job strong{color:#f4b94f}#tip{position:absolute;top:91px;left:50%;transform:translateX(-50%);font-size:12px;white-space:nowrap;text-align:center}#controls{position:absolute;bottom:12px;left:12px;right:12px;display:flex;align-items:end;justify-content:space-between;gap:8px} .cluster{display:flex;gap:7px;align-items:end;pointer-events:auto}.btn{border:1px solid #728087;border-radius:12px;background:rgba(17,27,33,.9);color:#fff;font-weight:750;min-width:54px;min-height:50px;padding:8px;font-size:12px;touch-action:none;box-shadow:0 3px 0 #101619}.btn:active,.btn.active{background:#d78a23;color:#111;border-color:#ffcb6d}.wide{min-width:72px}.label{font-size:10px;color:#c6d0d4;text-align:center;margin-bottom:5px}#status{position:absolute;left:10px;top:82px;font-size:11px}#meter{height:5px;background:#3c494e;border-radius:9px;overflow:hidden;margin-top:6px}#fill{height:100%;width:0;background:#e9a43b;transition:width .2s}#reset{position:absolute;right:10px;bottom:100px;pointer-events:auto;min-height:38px}#cross{position:absolute;left:50%;top:50%;width:24px;height:24px;transform:translate(-50%,-50%);opacity:.55}#cross:before,#cross:after{content:'';position:absolute;background:#fff}#cross:before{width:1px;height:24px;left:12px}#cross:after{height:1px;width:24px;top:12px}#toast{position:absolute;bottom:90px;left:50%;transform:translateX(-50%);background:#111d;padding:8px 13px;border-radius:10px;font-size:12px;opacity:0;transition:opacity .25s}#toast.show{opacity:1}@media(min-width:800px){.btn{min-width:65px;min-height:55px;font-size:13px}#tip{top:80px}}</style></head><body><div id="hud"><div id="brand" class="panel">WRECKWORKS <small>3D DEMOLITION SIMULATOR</small></div><div id="job" class="panel"><strong>JOB 01 · CLEAR THE OLD SHOP</strong><br>Demolition contract <span id="cash">$2,400</span></div><div id="status" class="panel">STRUCTURE DAMAGE <b id="percent">0%</b><div id="meter"><div id="fill"></div></div><div style="margin-top:5px;color:#c1ccd0">Tap a wall section or swing the boom into it</div></div><div id="tip" class="panel">DRIVE · AIM · SMASH · CLEAR</div><div id="cross"></div><div id="controls"><div class="cluster"><div><div class="label">TRACKS</div><button class="btn" id="left">◀</button><button class="btn" id="forward">▲</button><button class="btn" id="right">▶</button></div></div><div class="cluster"><div><div class="label">BOOM</div><button class="btn" id="up">BOOM +</button><button class="btn" id="down">BOOM −</button></div><div><div class="label">TOOL</div><button class="btn wide" id="swing">SWING</button><button class="btn wide" id="smash">SMASH!</button></div></div></div><button id="reset" class="btn">RESET JOB ↻</button><div id="toast">Impact!</div></div><script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script><script>
(()=>{'use strict';const $=id=>document.getElementById(id);const scene=new THREE.Scene();scene.background=new THREE.Color(0x91a9b4);scene.fog=new THREE.Fog(0x91a9b4,32,95);const camera=new THREE.PerspectiveCamera(58,innerWidth/innerHeight,.1,180);camera.position.set(8,7,11);const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));renderer.setSize(innerWidth,innerHeight);renderer.domElement.style.cssText='position:fixed;inset:0;z-index:0;width:100%;height:100%;display:block;touch-action:none';renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;document.body.appendChild(renderer.domElement);scene.add(new THREE.HemisphereLight(0xd9e8f1,0x554c3d,2.0));const sun=new THREE.DirectionalLight(0xffe1b2,3.0);sun.position.set(-9,17,10);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);scene.add(sun);const mat=(c,r=.85,m=0)=>new THREE.MeshStandardMaterial({color:c,roughness:r,metalness:m});const concrete=mat(0x969995),concrete2=mat(0xb3b2aa),dark=mat(0x20272a),yellow=mat(0xe6a526,.5,.15),glass=mat(0x263c46,.28,.25),rubber=mat(0x171a1b),steel=mat(0x66757b,.4,.7),groundmat=mat(0x777b70);function box(parent,w,h,d,material,x,y,z){const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),material);o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;parent.add(o);return o}const ground=box(scene,100,.3,100,groundmat,0,-.24,0);const grid=new THREE.GridHelper(90,45,0x4c5a53,0x69756b);grid.position.y=-.075;scene.add(grid); // site boundary
for(let i=-12;i<=12;i+=3){box(scene,.12,.8,.12,mat(0xe4dfc8),i,.3,-8);box(scene,.12,.8,.12,mat(0xe4dfc8),i,.3,8)}
// old workshop built as breakable masonry cells
const building=new THREE.Group();scene.add(building);building.position.set(-1,0,-3);const W=8,H=4.2,D=3.4,cols=8,rows=4;const cells=[];for(let face of ['front','back'])for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){if(r===0&&c>=2&&c<=4)continue;const w=W/cols-.045,h=H/rows-.045,x=-W/2+(c+.5)*W/cols,y=(r+.5)*H/rows,z=face==='front'?D/2:-D/2;const p=box(building,w,h,.16,r%2?concrete:concrete2,x,y,z);p.userData={breakable:true,health:1,home:p.position.clone(),face};cells.push(p)}// side walls
for(const side of [-1,1])for(let r=0;r<rows;r++)for(let c=0;c<3;c++){const p=box(building,.16,H/rows-.04,D/3-.04,concrete,side*W/2,(r+.5)*H/rows,-D/2+(c+.5)*D/3);p.userData={breakable:true,health:1,home:p.position.clone(),face:'side'};cells.push(p)}// roof slabs, partly breakable
for(let c=0;c<4;c++){const p=box(building,W/4-.05,.2,D,concrete2,-W/2+(c+.5)*W/4,H+.1,0);p.userData={breakable:true,health:1,home:p.position.clone(),face:'roof'};cells.push(p)}// signage, lintel and rebar
box(building,2.5,.42,.22,yellow,0,3.4,D/2+.11);box(building,2.1,.17,.25,dark,0,3.4,D/2+.24);for(let x=-3.7;x<=3.71;x+=.45)box(building,.035,3.7,.035,steel,x,1.85,D/2+.105);
// rubble bits
const debris=[],debrismats=[concrete,concrete2,mat(0x817f78),mat(0xaaa69b)];function spawnDebris(pos,n=5,power=1){for(let i=0;i<n;i++){const s=.12+Math.random()*.27;const mesh=new THREE.Mesh(new THREE.BoxGeometry(s*(.7+Math.random()),s,s*(.6+Math.random())),debrismats[(Math.random()*debrismats.length)|0]);mesh.position.copy(pos);mesh.position.x+=(Math.random()-.5)*.6;mesh.position.z+=(Math.random()-.5)*.6;mesh.position.y+=Math.random()*.4;mesh.rotation.set(Math.random()*2,Math.random()*2,Math.random()*2);mesh.castShadow=true;scene.add(mesh);debris.push({mesh,v:new THREE.Vector3((Math.random()-.5)*power*2,Math.random()*power*2+.5,(Math.random()-.5)*power*2),life:6+Math.random()*6})}}
// excavator base, tracks, rotating house, boom, stick, bucket
const machine=new THREE.Group();scene.add(machine);machine.position.set(5,0,2.7);const tracks=new THREE.Group();machine.add(tracks);for(const z of [-.62,.62]){box(tracks,2.05,.42,.42,rubber,0,.34,z);for(let i=0;i<7;i++){const wh=new THREE.Mesh(new THREE.CylinderGeometry(.19,.19,.12,12),steel);wh.rotation.z=Math.PI/2;wh.position.set(-.72+i*.24,.34,z*1.25);tracks.add(wh)}}box(machine,1.35,.34,1.05,yellow,0,.7,0);const house=new THREE.Group();house.position.set(-.05,.85,0);machine.add(house);box(house,1.1,.48,.95,yellow,0,.25,-.12);box(house,.55,.55,.58,glass,.13,.69,-.12);box(house,.6,.12,.65,dark,.13,1,-.12);box(house,.25,.12,.2,yellow,-.35,.57,.1);const pivot=new THREE.Group();pivot.position.set(.22,.38,.1);house.add(pivot);box(pivot,.28,.28,.3,steel,0,0,0);const boom=box(pivot,.28,2.15,.28,yellow,0,1.02,0);boom.rotation.z=-.52;const stickPivot=new THREE.Group();stickPivot.position.set(0,1.95,0);pivot.add(stickPivot);box(stickPivot,.22,1.65,.22,yellow,0,.72,0).rotation.z=.35;const bucketPivot=new THREE.Group();bucketPivot.position.set(0,1.5,0);stickPivot.add(bucketPivot);box(bucketPivot,.5,.28,.48,steel,0,-.08,.02);box(bucketPivot,.58,.09,.5,dark,0,-.24,.02);for(let i=0;i<5;i++){const tooth=box(bucketPivot,.07,.19,.07,steel,-.23+i*.115,-.35,.23);tooth.rotation.z=-.2}
// exhaust and work lights
box(house,.13,.45,.13,dark,-.4,.66,-.3);for(const z of [-.28,.28])box(house,.13,.12,.06,mat(0xfff1b0,.25),.58,.5,z);
let damage=0,boomAngle=-.52,stickAngle=.35,turn=0,smashCooldown=0,toastTimer=0;const downKeys=new Set();function toast(t){$('toast').textContent=t;$('toast').classList.add('show');toastTimer=2}function updateDamage(){damage=cells.filter(c=>!c.visible).length/cells.length;$('percent').textContent=Math.round(damage*100)+'%';$('fill').style.width=(damage*100)+'%';$('cash').textContent='$'+(2400+Math.round(damage*1800)).toLocaleString();if(damage>.98)toast('SITE DEMOLISHED — CONTRACT COMPLETE!')}
function smash(){if(smashCooldown>0)return;smashCooldown=.28;const target=new THREE.Vector3();bucketPivot.getWorldPosition(target);let hit=null,best=4.0;for(const c of cells){if(!c.visible)continue;const wp=new THREE.Vector3();c.getWorldPosition(wp);const d=wp.distanceTo(target);if(d<best){best=d;hit=c}}if(hit){const wp=new THREE.Vector3();hit.getWorldPosition(wp);hit.visible=false;spawnDebris(wp,8,1.5);if(Math.random()<.38){const neighbor=cells.filter(c=>c.visible&&c.position.distanceTo(hit.position)<1.25);if(neighbor.length){const n=neighbor[(Math.random()*neighbor.length)|0];n.visible=false;const p=new THREE.Vector3();n.getWorldPosition(p);spawnDebris(p,5,1.1)}}updateDamage();toast('CONCRETE IMPACT · SECTION BROKEN')}else{const p=target.clone();spawnDebris(p,3,.65);toast('Bucket impact — reposition to hit wall')}}
// tap/click a visible wall cell to target it; visual target marker
const raycaster=new THREE.Raycaster(),pointer=new THREE.Vector2();renderer.domElement.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse'&&e.button!==0)return;pointer.x=e.clientX/innerWidth*2-1;pointer.y=-(e.clientY/innerHeight)*2+1;raycaster.setFromCamera(pointer,camera);const hits=raycaster.intersectObjects(cells.filter(c=>c.visible),false);if(hits.length){const c=hits[0].object;c.visible=false;const p=new THREE.Vector3();c.getWorldPosition(p);spawnDebris(p,9,1.6);updateDamage();toast('Targeted demolition hit!')}});
function bind(id,fn){const el=$(id);el.addEventListener('pointerdown',e=>{e.preventDefault();el.setPointerCapture?.(e.pointerId);downKeys.add(id);el.classList.add('active');fn(true)});const off=e=>{downKeys.delete(id);el.classList.remove('active');fn(false)};el.addEventListener('pointerup',off);el.addEventListener('pointercancel',off);el.addEventListener('lostpointercapture',off)}bind('left',v=>{if(v)turn=-1;else if(turn===-1)turn=0});bind('right',v=>{if(v)turn=1;else if(turn===1)turn=0});bind('forward',v=>{machine.userData.drive=v?1:0});bind('up',v=>{machine.userData.boom=v?1:0});bind('down',v=>{machine.userData.boom=v?-1:0});bind('swing',v=>{house.userData.swing=v?1:0});$('smash').addEventListener('pointerdown',e=>{e.preventDefault();smash()});$('reset').addEventListener('click',()=>{for(const c of cells){c.visible=true}for(const d of debris)scene.remove(d.mesh);debris.length=0;machine.position.set(5,0,2.7);house.rotation.y=0;pivot.rotation.z=0;stickPivot.rotation.z=0;damage=0;updateDamage();toast('Job reset — ready to demolish')});let last=performance.now();function animate(now){requestAnimationFrame(animate);const dt=Math.min((now-last)/1000,.04);last=now;smashCooldown=Math.max(0,smashCooldown-dt);if(toastTimer>0){toastTimer-=dt;if(toastTimer<=0)$('toast').classList.remove('show')}machine.position.x+=machine.userData.drive*Math.cos(house.rotation.y)*dt*1.4;machine.position.z-=machine.userData.drive*Math.sin(house.rotation.y)*dt*1.4;house.rotation.y+=turn*dt*.85;if(machine.userData.boom)pivot.rotation.z=THREE.MathUtils.clamp(pivot.rotation.z+machine.userData.boom*dt*.55,-.95,.65);if(house.userData.swing)house.rotation.y+=house.userData.swing*dt*.9;stickPivot.rotation.z=stickAngle;bucketPivot.rotation.z=-pivot.rotation.z*.25-.25;for(let i=debris.length-1;i>=0;i--){const d=debris[i];d.life-=dt;d.v.y-=4.8*dt;d.mesh.position.addScaledVector(d.v,dt);d.mesh.rotation.x+=dt*2;d.mesh.rotation.z+=dt; if(d.mesh.position.y<.1){d.mesh.position.y=.1;d.v.y*=-.18;d.v.x*=.75;d.v.z*=.75}if(d.life<=0){scene.remove(d.mesh);debris.splice(i,1)}}const target=new THREE.Vector3(machine.position.x,1,machine.position.z);const camDesired=new THREE.Vector3(machine.position.x+8,6.8,machine.position.z+9);camera.position.lerp(camDesired,.035);camera.lookAt(new THREE.Vector3(-.2,1.5,-1.2));renderer.render(scene,camera)}updateDamage();requestAnimationFrame(animate);addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});})();</script></body></html>
