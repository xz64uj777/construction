<script>
function err(m){let e=document.getElementById('startup-error');if(!e){e=document.createElement('div');e.id='startup-error';document.body.appendChild(e)}e.textContent='3D game startup issue: '+m+'. Check your connection and reload.'}

function start(){'use strict';
const $=id=>document.getElementById(id),scene=new THREE.Scene();scene.background=new THREE.Color(0xb5c1c4);scene.fog=new THREE.Fog(0xb5c1c4,36,100);

function box(p,w,h,d,m,x,y,z){let o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;p.add(o);return o}

box(scene,100,.3,100,soil,0,-.22,0);box(scene,34,.06,17,asphalt,0,-.035,1);
const grid=new THREE.GridHelper(80,40,0x5c655f,0x7b817a);grid.position.y=-.06;scene.add(grid);
// construction barriers and site lights

// A masonry building assembled from individually breakable brick/concrete panels
const building=new THREE.Group();building.position.set(-1.2,0,-3.4);scene.add(building);const cells=[];const W=8.8,H=5,D=3.8,cols=11,rows=5;
for(const face of ['front','back'])for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){if(r<2&&c>=4&&c<=6)continue;let w=W/cols-.035,h=H/rows-.035,x=-W/2+(c+.5)*W/cols,y=(r+.5)*H/rows,z=face==='front'?D/2:-D/2;let p=box(building,w,h,.22,[brickA,brickB,brickC][(r+c)%3],x,y,z);p.userData={home:p.position.clone(),health:1};cells.push(p)}
for(const side of [-1,1])for(let r=0;r<rows;r++)for(let c=0;c<4;c++){let p=box(building,.22,H/rows-.04,D/4-.04,[brickA,brickB][(r+c)%2],side*W/2,(r+.5)*H/rows,-D/2+(c+.5)*D/4);p.userData={home:p.position.clone(),health:1};cells.push(p)}
for(let c=0;c<4;c++){let p=box(building,W/4-.05,.24,D,brickC,-W/2+(c+.5)*W/4,H+.1,0);p.userData={home:p.position.clone(),health:1};cells.push(p)}
// broken edges, window lintel, faded warning board

for(let x=-4.15;x<4.2;x+=.4)box(building,.045,4.4,.045,steel,x,2.2,D/2+.12);

const upper=new THREE.Group();upper.position.y=.62;crane.add(upper);box(upper,2.2,.35,1.45,yellow,0,.08,0);box(upper,.8,.52,.85,black,-.55,.48,-.12);box(upper,.52,.58,.5,glass,-.55,.84,-.12);box(upper,.62,.12,.57,yellow,-.55,1.16,-.12);

const boom=new THREE.Group();boom.position.set(0,0,0);boom.rotation.z=boomAngle;boomPivot.add(boom);
function beam(a,b,r=.065,m=yellow){return cable(boom,new THREE.Vector3(...a),new THREE.Vector3(...b),r,m)}
// two parallel lattice trusses with cross-bracing
for(const z of [-.32,.32]){beam([0,0,z],[0,boomLen,z],.11,yellow);beam([.0,0,z],[.0,boomLen,z],.08,steel);for(let i=0;i<10;i++){let y=i*boomLen/10,y2=(i+1)*boomLen/10;beam([0,y,z],[0,y2,z],.045,yellow);beam([-.22,y,z],[.22,y2,z],.035,steel);beam([.22,y,z],[-.22,y2,z],.035,steel)}}
for(let i=0;i<=10;i++){let y=i*boomLen/10;beam([-.22,y,-.32],[.22,y,-.32],.035,steel);beam([-.22,y,.32],[.22,y,.32],.035,steel)}
// main hoist cable and heavy wrecking ball on a swinging pendulum
const cableRoot=new THREE.Group();boom.add(cableRoot);const cableMesh=cyl(cableRoot,.035,.035,1, cableMat,0,-.5,0,10);
const ballRig=new THREE.Group();scene.add(ballRig);const ballGroup=new THREE.Group();ballRig.add(ballGroup);
const ball=cyl(ballGroup,.62,.62,1.08,steel,0,0,0,24);ball.rotation.x=Math.PI/2;const ballTop=cyl(ballGroup,.22,.22,.3,black,0,.62,0,16);const eye=cyl(ballGroup,.11,.11,.38,steel,0,.83,0,12);for(let i=0;i<3;i++){let ring=new THREE.Mesh(new THREE.TorusGeometry(.61-i*.04,.035,8,24),black);ring.position.y=(i-1)*.2;ballGroup.add(ring)}
// secondary hanging hook/weight detailing
let swingControlX=0,swingControlY=0,cameraDistance=23,minCameraDistance=8,maxCameraDistance=34,pinchStartDistance=0,pinchStartZoom=23;let cameraYaw=Math.atan2(12,18),cameraPitch=Math.asin(8/Math.hypot(12,8,18)),cameraDrag=null,cameraMoved=false;const activeTouches=new Map();let debris=[],debrisMats=[brickA,brickB,brickC,mat(0xb5ada0)];let swingAngle=0,swingVelocity=0,ropeLength=3.3,damage=0,craneTurn=0,drive=0,winch=0,swingHeld=false,releasePulse=0,toastTimer=0,hitCooldown=0;
function toast(s){$('toast').textContent=s;$('toast').classList.add('show');toastTimer=2.2}
function spawnDebris(pos,n=8,power=2){for(let i=0;i<n;i++){let s=.12+Math.random()*.28;let o=new THREE.Mesh(new THREE.BoxGeometry(s*(.7+Math.random()),s,s*(.6+Math.random())),debrisMats[(Math.random()*debrisMats.length)|0]);o.position.copy(pos);o.position.x+=(Math.random()-.5)*.7;o.position.z+=(Math.random()-.5)*.7;o.position.y+=Math.random()*.4;o.rotation.set(Math.random()*3,Math.random()*3,Math.random()*3);o.castShadow=true;scene.add(o);debris.push({mesh:o,v:new THREE.Vector3((Math.random()-.5)*power*1.8,Math.random()*power+0.5,(Math.random()-.5)*power*1.8),life:7+Math.random()*7})}}
function updateStats(){damage=cells.filter(c=>!c.visible).length/cells.length;$('percent').textContent=Math.round(damage*100)+'%';$('fill').style.width=(damage*100)+'%';$('debrisCount').textContent=cells.filter(c=>!c.visible).length;$('cash').textContent='$'+(3000+Math.round(damage*2200)).toLocaleString()+' earned';if(damage>.98)toast('BUILDING DOWN — CONTRACT COMPLETE!')}
function impact(){if(hitCooldown>0)return;hitCooldown=.42;const bp=new THREE.Vector3();ballGroup.getWorldPosition(bp);let target=null,best=2.0;for(let c of cells){if(!c.visible)continue;let p=new THREE.Vector3();c.getWorldPosition(p);let d=p.distanceTo(bp);if(d<best){best=d;target=c}}
if(target){let p=new THREE.Vector3();target.getWorldPosition(p);target.visible=false;spawnDebris(p,12,2.6);for(let c of cells){if(!c.visible)continue;let q=new THREE.Vector3();c.getWorldPosition(q);if(q.distanceTo(p)<1.12&&Math.random()<.38){c.visible=false;spawnDebris(q,5,1.6)}}swingVelocity*=.55;updateStats();toast('WRECKING BALL IMPACT · MASONRY BREAKS')}}
// set cable/ball position from boom tip, hoist length and swing angle in local boom coordinates
function updateBall(){let tip=new THREE.Vector3(0,boomLen,0);boom.localToWorld(tip);let dir=new THREE.Vector3(Math.sin(swingAngle),-Math.cos(swingAngle),0);let ballPos=tip.clone().addScaledVector(dir,ropeLength);ballRig.position.copy(ballPos);cableMesh.position.set(0,-ropeLength/2,0);cableMesh.scale.y=ropeLength;cableMesh.rotation.z=swingAngle;}
// direct tap wall breaks a section, touch controls operate crane
const ray=new THREE.Raycaster(),pt=new THREE.Vector2();let worldTap=null;renderer.domElement.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse'&&e.button!==0)return;worldTap={id:e.pointerId,x:e.clientX,y:e.clientY,startX:e.clientX,startY:e.clientY};cameraDrag={id:e.pointerId,x:e.clientX,y:e.clientY};cameraMoved=false;renderer.domElement.setPointerCapture?.(e.pointerId)});renderer.domElement.addEventListener('pointermove',e=>{if(!cameraDrag||cameraDrag.id!==e.pointerId)return;const dx=e.clientX-cameraDrag.x,dy=e.clientY-cameraDrag.y;if(Math.abs(e.clientX-worldTap.startX)+Math.abs(e.clientY-worldTap.startY)>5)cameraMoved=true;if(activeTouches.size<2){cameraYaw-=dx*.008;cameraPitch=THREE.MathUtils.clamp(cameraPitch+dy*.006,-.15,1.15)}cameraDrag.x=e.clientX;cameraDrag.y=e.clientY});function finishCameraDrag(e){if(!worldTap||worldTap.id!==e.pointerId)return;const tap=worldTap;worldTap=null;cameraDrag=null;if(!cameraMoved&&activeTouches.size<2){pt.set(tap.x/innerWidth*2-1,-tap.y/innerHeight*2+1);ray.setFromCamera(pt,camera);let h=ray.intersectObjects(cells.filter(c=>c.visible),false);if(h.length){let c=h[0].object,p=new THREE.Vector3();c.getWorldPosition(p);c.visible=false;spawnDebris(p,10,2);updateStats();toast('Section targeted · masonry falls')}}}renderer.domElement.addEventListener('pointerup',finishCameraDrag);renderer.domElement.addEventListener('pointercancel',finishCameraDrag);
function bind(id,fn){let el=$(id);el.addEventListener('pointerdown',e=>{e.preventDefault();el.setPointerCapture?.(e.pointerId);el.classList.add('active');fn(true)});let off=()=>{el.classList.remove('active');fn(false)};el.addEventListener('pointerup',off);el.addEventListener('pointercancel',off);el.addEventListener('lostpointercapture',off)}
function joystick(id,onMove){const el=$(id),knob=el.querySelector('.stick-knob');let activeId=null;function update(e){const r=el.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,max=r.width*.34;let x=(e.clientX-cx)/max,y=(e.clientY-cy)/max;const len=Math.hypot(x,y);if(len>1){x/=len;y/=len}knob.style.left=(50+x*34)+'%';knob.style.top=(50+y*34)+'%';onMove(x,-y)}function stop(e){if(activeId!==null&&e.pointerId!==activeId)return;activeId=null;knob.style.left='50%';knob.style.top='50%';onMove(0,0)}el.addEventListener('pointerdown',e=>{e.preventDefault();activeId=e.pointerId;el.setPointerCapture(e.pointerId);update(e)});el.addEventListener('pointermove',e=>{if(e.pointerId===activeId)update(e)});el.addEventListener('pointerup',stop);el.addEventListener('pointercancel',stop);el.addEventListener('lostpointercapture',stop)}joystick('driveStick',(x,y)=>{craneTurn=x;drive=y});joystick('swingStick',(x,y)=>{swingHeld=Math.abs(x)>.08||Math.abs(y)>.08;swingControlX=x;swingControlY=y});bind('raise',v=>{winch=v?-1:0});bind('lower',v=>{winch=v?1:0});$('release').addEventListener('pointerdown',e=>{e.preventDefault();swingVelocity+=swingAngle===0?2.8:Math.sign(swingAngle)*1.8;releasePulse=.22;toast('HOIST RELEASED · BALL IN MOTION')});

for(let i=debris.length-1;i>=0;i--){let d=debris[i];d.life-=dt;d.v.y-=5.5*dt;d.mesh.position.addScaledVector(d.v,dt);d.mesh.rotation.x+=dt*2.4;d.mesh.rotation.z+=dt*1.7;if(d.mesh.position.y<.12){d.mesh.position.y=.12;d.v.y*=-.16;d.v.x*=.72;d.v.z*=.72}if(d.life<=0){scene.remove(d.mesh);debris.splice(i,1)}}
let look=new THREE.Vector3(0,2,-.7);let cp=Math.cos(cameraPitch);let camDir=new THREE.Vector3(Math.sin(cameraYaw)*cp,Math.sin(cameraPitch),Math.cos(cameraYaw)*cp);camera.position.lerp(look.clone().addScaledVector(camDir,cameraDistance),.18);camera.lookAt(look);renderer.render(scene,camera)}

}
